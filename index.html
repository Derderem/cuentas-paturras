<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuenta Clara - Grupos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #1a262b; color: white; }
    .card { background-color: #24343a; border-radius: 1rem; }
    .input-field { background-color: white; color: black; border-radius: 0.5rem; padding: 0.5rem; width: 100%; }
    .btn-primary { background-color: #0d6d5c; color: white; font-weight: bold; transition: 0.3s; }
    .btn-primary:hover { background-color: #148c7a; }
    .accent-yellow { color: #facc15; }
  </style>
</head>
<body class="p-4 md:p-8">

  <!-- Header -->
  <div class="flex justify-between items-center mb-8">
    <div class="flex items-center gap-2 bg-yellow-400 text-black px-3 py-1 rounded-full font-bold text-sm">
      📁 <span id="nombre-grupo">Sin grupo</span>
    </div>
    <button onclick="createGroup()" class="btn-primary px-4 py-2 rounded-full text-sm">+ Nuevo</button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2 space-y-6">
      <div class="card p-4 md:p-8 flex flex-col gap-6">
        <!-- HERO -->
        <div class="flex flex-row items-start justify-between gap-3">
          <div class="flex-1">
            <h1 class="text-5xl md:text-6xl font-extrabold leading-none">Cuenta Clara</h1>
            <h2 class="text-3xl md:text-5xl font-extrabold mb-4 accent-yellow leading-none">para grupos</h2>
            <p class="font-bold text-xl leading-tight opacity-90 max-w-[280px]">Crea un grupo, apunta cada compra con su ticket y descubre al instante quien paga a quien.</p>
          </div>
          <img src="logo-pato.png" class="w-40 md:w-72 h-auto drop-shadow-2xl" alt="pato">
        </div>
        <!-- TOTALES -->
        <div class="grid grid-cols-3 gap-3">
          <div class="bg-[#1a262b] p-4 rounded-2xl border border-gray-700"><p class="text-gray-300 text-sm">Total gastado</p><p id="total-gastado" class="text-3xl font-black">0,00 €</p></div>
          <div class="bg-[#1a262b] p-4 rounded-2xl border border-gray-700"><p class="text-gray-300 text-sm">Por persona</p><p id="por-persona" class="text-3xl font-black">0,00 €</p></div>
          <div class="bg-[#1a262b] p-4 rounded-2xl border border-gray-700"><p class="text-gray-300 text-sm">Movimientos</p><p id="total-movimientos" class="text-3xl font-black">0</p></div>
        </div>
      </div>

      <!-- INTEGRANTES -->
      <div class="card p-6">
        <h2 class="text-xl font-bold mb-4">👥 Integrantes</h2>
        <div class="flex gap-2 mb-4">
          <input id="nuevo-integrante" type="text" placeholder="Nuevo integrante" class="input-field">
          <button onclick="addMember()" class="bg-yellow-400 text-black px-4 py-2 rounded-lg font-bold">+</button>
        </div>
        <div id="lista-integrantes" class="space-y-2"></div>
      </div>
    </div>

    <!-- DERECHA -->
    <div class="space-y-6">
      <div class="bg-white text-black p-6 rounded-3xl">
        <h2 class="text-2xl font-bold mb-4">Añadir gasto</h2>
        <div class="space-y-3">
          <input id="gasto-descripcion" type="text" placeholder="Cena, súper..." class="input-field border">
          <div class="grid grid-cols-2 gap-3">
            <input id="gasto-importe" type="number" placeholder="42.50" class="input-field border">
            <select id="gasto-pago" class="input-field border"></select>
          </div>
          <button onclick="addExpense()" class="btn-primary w-full py-3 rounded-xl">+ Guardar gasto</button>
        </div>
      </div>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://tnlsxnuavtofejejoydq.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRubHN4bnVhdnRvZmVqZWpveWRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMTY3MjMsImV4cCI6MjA5NjU5MjcyM30.U0Fd-4sgMpAU7yBcgvOwiqsg_cC1JZ4LmE4KST5hMbw
';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentGroupId = localStorage.getItem('grupo_id');
  let currentGroupName = localStorage.getItem('grupo_nombre') || 'Sin grupo';

  async function loadData() {
    document.getElementById('nombre-grupo').innerText = currentGroupName;
    if (!currentGroupId) return;

    const { data: members } = await db.from('integrantes').select('*').eq('grupo_id', currentGroupId);
    const lista = document.getElementById('lista-integrantes');
    const select = document.getElementById('gasto-pago');
    lista.innerHTML = ''; select.innerHTML = '<option value="">¿Quién pagó?</option>';
    
    members.forEach(m => {
      lista.innerHTML += `<div class="bg-[#1a262b] p-3 rounded-lg">${m.nombre}</div>`;
      select.innerHTML += `<option value="${m.id}">${m.nombre}</option>`;
    });

    const { data: expenses } = await db.from('gastos').select('*').eq('grupo_id', currentGroupId);
    const total = expenses.reduce((a, c) => a + parseFloat(c.importe), 0);
    document.getElementById('total-gastado').innerText = total.toFixed(2) + ' €';
    document.getElementById('total-movimientos').innerText = expenses.length;
    document.getElementById('por-persona').innerText = (members.length ? total / members.length : 0).toFixed(2) + ' €';
  }

  async function createGroup() {
    const nombre = prompt('Nombre del grupo:');
    if (!nombre) return;
    const { data, error } = await db.from('grupos').insert({ nombre }).select().single();
    if (error) { alert('Error: ' + error.message); return; }
    currentGroupId = data.id; currentGroupName = data.nombre;
    localStorage.setItem('grupo_id', currentGroupId);
    localStorage.setItem('grupo_nombre', currentGroupName);
    loadData();
  }

  async function addMember() {
    if (!currentGroupId) return alert('Primero pulsa + Nuevo');
    const nombre = document.getElementById('nuevo-integrante').value;
    if (!nombre) return;
    await db.from('integrantes').insert({ nombre, grupo_id: currentGroupId });
    document.getElementById('nuevo-integrante').value = '';
    loadData();
  }

  async function addExpense() {
    const descripcion = document.getElementById('gasto-descripcion').value;
    const importe = document.getElementById('gasto-importe').value;
    const pagado_por = document.getElementById('gasto-pago').value;
    if (!descripcion || !importe || !pagado_por) return alert('Rellena todo');
    await db.from('gastos').insert({ descripcion, importe: parseFloat(importe), pagado_por, grupo_id: currentGroupId });
    loadData();
  }

  loadData();
</script>
</body>
</html>
