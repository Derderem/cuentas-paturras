  async function loadGroups() {

    .from('grupos')

  if (error) {
    alert('Error cargando grupos: ' + error.message);

    function toggleGroupMenu() {

  menu.classList.toggle('hidden');
}

}

function selectGroup(groupId, groupName) {
  currentGroupId = groupId || null;
  currentGroupName = groupName || 'Sin grupo';

  if (currentGroupId) {
    localStorage.setItem('grupo_id', currentGroupId);
    localStorage.setItem('grupo_nombre', currentGroupName);
  } else {
    localStorage.removeItem('grupo_id');
    localStorage.removeItem('grupo_nombre');
  }

  document.getElementById('grupo-seleccionado-texto').innerText = currentGroupName;
  closeGroupMenu();
  loadData();
}

    function getCurrentGroupCode() {
  const grupo = allGroups.find(g => g.id == currentGroupId);
  return grupo ? grupo.codigo : null;
}
    
function getCurrentInviteLink() {
  const codigo = getCurrentGroupCode();

  return `${window.location.origin}/?codigo=${codigo}`;
}

function toggleInviteMenu() {

  const menu = document.getElementById('invite-menu');
  menu.classList.toggle('hidden');
}

async function copyInviteLink() {
  const link = getCurrentInviteLink();

  if (!link) {
    alert('No hay grupo seleccionado');
    return;

  try {
    await navigator.clipboard.writeText(link);
    alert('Enlace copiado');
    document.getElementById('invite-menu').classList.add('hidden');
  } catch (e) {

   async function createGroup(nombreManual = null) {
  const nombre = nombreManual?.trim();
  if (!nombre) return;

  const codigo = generarCodigo();

  const { data, error } = await db
    .from('grupos')
    .insert({
      nombre: nombre,
      codigo: codigo
    })
    .select()
    .single();

  if (error) {
    alert('Error: ' + error.message);
    return;
  }

  currentGroupId = data.id;
  currentGroupName = data.nombre;

  localStorage.setItem('grupo_id', currentGroupId);
  localStorage.setItem('grupo_nombre', currentGroupName);

  await loadGroups();
  loadData();

  closeCreateGroupModal();
  showGroupCreatedToast();
}

    async function autoJoinByUrlCode() {
  const params = new URLSearchParams(window.location.search);
  const codigo = params.get('codigo');

  if (!codigo) return;

  const { data, error } = await db
    .from('grupos')
    .select('*')
    .eq('codigo', codigo.toUpperCase())
    .single();

  if (error || !data) return;

  currentGroupId = data.id;
  currentGroupName = data.nombre;

  localStorage.setItem('grupo_id', currentGroupId);
  localStorage.setItem('grupo_nombre', currentGroupName);

  await loadGroups();
  loadData();
}
    
    async function deleteGroup() {
  if (!currentGroupId) return alert('Selecciona un grupo');

  const confirmar = confirm(`¿Seguro que quieres eliminar el grupo "${currentGroupName}"?`);
  if (!confirmar) return;

  // 1. Buscar gastos del grup
  const { data: expenses, error: expensesError } = await db
    .from('gastos')
    .select('ticket_url')
    .eq('grupo_id', currentGroupId);

  if (expensesError) {
    alert('Error al buscar gastos: ' + expensesError.message);
    return;
  }

  // 2. Sacar nombres de archivos del bucket
  const filesToDelete = (expenses || [])
    .map(e => {
      if (!e.ticket_url) return null;
      const parts = e.ticket_url.split('/tickets/');
      return parts[1] || null;
    })
    .filter(Boolean);

  // 3. Borrar archivos del bucket si existen
  if (filesToDelete.length > 0) {
    const { error: storageError } = await db.storage
      .from('tickets')
      .remove(filesToDelete);

    if (storageError) {
      alert('Error al borrar tickets: ' + storageError.message);
      return;
    }
  }

  // 4. Borrar grupo
  const { error } = await db
    .from('grupos')
    .delete()
    .eq('id', currentGroupId);

  if (error) {
    alert('Error al eliminar grupo: ' + error.message);
    return;
  }

  currentGroupId = null;
  currentGroupName = 'Sin grupo';

  localStorage.removeItem('grupo_id');
  localStorage.removeItem('grupo_nombre');

  await loadGroups();
  loadData();

  alert('Grupo y archivos eliminados');
}

    async function addMember() {
      if (!currentGroupId) return alert('Primero pulsa + Nuevo');

      const input = document.getElementById('nuevo-integrante');
      const nombre = input.value.trim();
      if (!nombre) return;

      const { error } = await db.from('integrantes').insert({
        nombre,
        grupo_id: currentGroupId
      });

      if (error) {
        alert('Error: ' + error.message);
        return;
      }

      input.value = '';
      loadData();
    }

    async function addExpense() {
      if (!currentGroupId) return alert('Primero crea un grupo');

      const descripcion = document.getElementById('gasto-descripcion').value.trim();
      const importe = document.getElementById('gasto-importe').value;
      const pagado_por = document.getElementById('gasto-pago').value;
      const ticketFile = document.getElementById('gasto-ticket').files[0];

      if (!descripcion || !importe || !pagado_por) return alert('Rellena todo');

      let ticket_url = null;

      if (ticketFile) {
        const fileName = `${Date.now()}-${ticketFile.name}`;

        const { error: uploadError } = await db.storage
          .from('tickets')
          .upload(fileName, ticketFile);

        if (uploadError) {
          alert('Error subiendo ticket: ' + uploadError.message);
          return;
        }

        const { data: publicUrlData } = db.storage
          .from('tickets')
          .getPublicUrl(fileName);

        ticket_url = publicUrlData.publicUrl;
      }

      const { error } = await db.from('gastos').insert({
        descripcion,
        importe: parseFloat(importe),
        pagado_por,
        grupo_id: currentGroupId,
        ticket_url
      });

      if (error) {
        alert('Error: ' + error.message);
        return;
      }

      document.getElementById('gasto-descripcion').value = '';
      document.getElementById('gasto-importe').value = '';
      document.getElementById('gasto-pago').value = '';
      document.getElementById('gasto-ticket').value = '';

      loadData();
    }

    async function resolverPagos() {
      if (!currentGroupId) return alert('Primero crea un grupo');

      const { data: members, error: membersError } = await db
        .from('integrantes')
        .select('*')
        .eq('grupo_id', currentGroupId);

      if (membersError) {
        alert('Error integrantes: ' + membersError.message);
        return;
      }

      const { data: expenses, error: expensesError } = await db
        .from('gastos')
        .select('*')
        .eq('grupo_id', currentGroupId);

      if (expensesError) {
        alert('Error gastos: ' + expensesError.message);
        return;
      }

      if (!members.length || !expenses.length) {
        document.getElementById('resultado-pagos').innerHTML =
          '<div class="bg-yellow-100 text-yellow-800 p-3 rounded-lg">No hay datos suficientes.</div>';
        return;
      }

      const total = expenses.reduce((sum, e) => sum + parseFloat(e.importe || 0), 0);
      const porPersona = total / members.length;

      const balance = {};

      members.forEach(m => {
        balance[m.id] = {
          nombre: m.nombre,
          pagado: 0,
          debe: porPersona,
          balance: 0
        };
      });

      expenses.forEach(e => {
        if (balance[e.pagado_por]) {
          balance[e.pagado_por].pagado += parseFloat(e.importe || 0);
        }
      });

      Object.keys(balance).forEach(id => {
        balance[id].balance = balance[id].pagado - balance[id].debe;
      });

      const acreedores = [];
      const deudores = [];

      Object.values(balance).forEach(p => {
        if (p.balance > 0.01) acreedores.push({ nombre: p.nombre, cantidad: p.balance });
        if (p.balance < -0.01) deudores.push({ nombre: p.nombre, cantidad: Math.abs(p.balance) });
      });

      const pagos = [];
      let i = 0;
      let j = 0;

      while (i < deudores.length && j < acreedores.length) {
        const cantidad = Math.min(deudores[i].cantidad, acreedores[j].cantidad);

        pagos.push({
          deudor: deudores[i].nombre,
          acreedor: acreedores[j].nombre,
          cantidad: cantidad
        });

        deudores[i].cantidad -= cantidad;
        acreedores[j].cantidad -= cantidad;

        if (deudores[i].cantidad < 0.01) i++;
        if (acreedores[j].cantidad < 0.01) j++;
      }

      const resultado = document.getElementById('resultado-pagos');

      if (!pagos.length) {
        resultado.innerHTML = '<div class="bg-green-100 text-green-800 p-3 rounded-lg">Todo está equilibrado.</div>';
        return;
      }

      resultado.innerHTML = pagos.map(p => `
        <div class="bg-[#1a262b] text-white p-3 rounded-lg flex justify-between items-center">
          <span>${p.deudor} paga a ${p.acreedor}</span>
          <span class="font-bold text-yellow-400">${p.cantidad.toFixed(2)} €</span>
        </div>
      `).join('');
    }

    groupMenu.classList.add('hidden');
  }

  const inviteMenu = document.getElementById('invite-menu');
  const inviteButton = event.target.closest('button');

  if (!event.target.closest('#invite-menu') && !inviteButton?.onclick?.toString().includes('toggleInviteMenu')) {
    inviteMenu?.classList.add('hidden');
  }
});
    
  </script>
  <!-- Modal crear grupo -->
<div id="modal-crear-grupo" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
  <div class="bg-[#24343a] w-full max-w-sm rounded-3xl p-6 shadow-2xl">
    <h2 class="text-xl font-bold mb-4 text-white">Crear nuevo grupo</h2>
    <input id="input-nombre-grupo" type="text" placeholder="Nombre del grupo" class="input-field text-sm mb-4">
    <div class="flex gap-2 justify-end">
      <button onclick="closeCreateGroupModal()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-xl text-sm font-bold">
        Cancelar
      </button>
      <button onclick="confirmCreateGroup()" class="btn-primary px-4 py-2 rounded-xl text-sm">
        Crear
      </button>
    </div>
  </div>
</div>

<!-- Mensaje grupo creado -->
<div id="toast-grupo-creado" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-green-600 text-white px-5 py-3 rounded-2xl shadow-xl z-50 font-bold text-sm">
  ✅ Grupo creado
</div>
